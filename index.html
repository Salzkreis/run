<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Chemical Plant Runner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      color: #00ff88;
      overflow: hidden;
    }
    #ui {
      display: flex;
      gap: 40px;
      margin-bottom: 10px;
      font-size: 18px;
      text-shadow: 0 0 10px #00ff88;
    }
    #canvas {
      border: 2px solid #00ff88;
      box-shadow: 0 0 30px #00ff8840, 0 0 60px #00ff8820;
      display: block;
    }
    #overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      pointer-events: none;
    }
    #overlay h1 {
      font-size: 48px;
      color: #00ff88;
      text-shadow: 0 0 20px #00ff88;
      letter-spacing: 4px;
    }
    #overlay .subtitle {
      font-size: 16px;
      color: #88ffcc;
      letter-spacing: 2px;
    }
    #overlay .controls {
      font-size: 13px;
      color: #558866;
      text-align: center;
      line-height: 1.8;
    }
    #overlay .start-btn {
      font-size: 22px;
      color: #00ff88;
      text-shadow: 0 0 15px #00ff88;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <div id="ui">
    <span>PUNKTE: <span id="score">0</span></span>
    <span>BESTZEIT: <span id="best">0</span></span>
    <span>LEVEL: <span id="level">1</span></span>
  </div>
  <div style="position:relative;">
    <canvas id="canvas" width="900" height="400"></canvas>
    <div id="overlay">
      <h1>CHEMICAL PLANT</h1>
      <div class="subtitle">☣ ENDLESS RUNNER ☣</div>
      <div class="controls">
        LEERTASTE / PFEIL OBEN — Springen<br>
        PFEIL LINKS / RECHTS — Ausweichen<br>
        DOPPELSPRUNG möglich!
      </div>
      <div class="start-btn">[ LEERTASTE zum Starten ]</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const overlay = document.getElementById('overlay');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const levelEl = document.getElementById('level');

    // ─── Game State ───────────────────────────────────────────────────────────
    let state = 'start'; // 'start' | 'running' | 'dead'
    let score = 0, best = 0, frame = 0, level = 1;
    let speed = 4;

    // ─── Player ───────────────────────────────────────────────────────────────
    const LANES = [H - 120, H - 180, H - 240]; // bottom, mid, top lane Y
    let player = {
      laneIndex: 0,
      x: 120,
      y: LANES[0],
      w: 36, h: 52,
      vy: 0,
      jumps: 0,
      maxJumps: 2,
      onGround: true,
      targetY: LANES[0],
      laneChanging: false,
      dead: false,
      glowTime: 0
    };

    const GRAVITY = 0.55;
    const JUMP_FORCE = -13;

    // ─── Obstacles ────────────────────────────────────────────────────────────
    let obstacles = [];
    let particles = [];
    let bgElements = [];

    // ─── Backgrounds ─────────────────────────────────────────────────────────
    let bgX = 0;
    const BG_COLORS = {
      sky: '#050510',
      ground: '#1a1a2e',
      platform: '#0d2230'
    };

    // Pipe colors
    const PIPE_COLS = ['#2a4a2a','#1a3a4a','#3a2a1a','#2a1a3a'];

    // ─── Input ────────────────────────────────────────────────────────────────
    const keys = {};
    const justPressed = {};

    document.addEventListener('keydown', e => {
      if (!keys[e.code]) justPressed[e.code] = true;
      keys[e.code] = true;

      if (state === 'start' && e.code === 'Space') startGame();
      if (state === 'dead' && e.code === 'Space') startGame();

      if (state === 'running') {
        if (e.code === 'Space' || e.code === 'ArrowUp') tryJump();
        if (e.code === 'ArrowLeft') moveLane(-1);
        if (e.code === 'ArrowRight') moveLane(1);
      }
      e.preventDefault();
    });

    document.addEventListener('keyup', e => { keys[e.code] = false; });

    function tryJump() {
      if (player.jumps < player.maxJumps) {
        player.vy = JUMP_FORCE;
        player.jumps++;
        player.onGround = false;
        spawnJumpParticles();
      }
    }

    function moveLane(dir) {
      let next = player.laneIndex + dir;
      if (next < 0) next = 0;
      if (next > LANES.length - 1) next = LANES.length - 1;
      if (next !== player.laneIndex) {
        player.laneIndex = next;
        player.targetY = LANES[next];
        player.laneChanging = true;
      }
    }

    // ─── Game lifecycle ───────────────────────────────────────────────────────
    function startGame() {
      state = 'running';
      score = 0; frame = 0; level = 1; speed = 4;
      obstacles = []; particles = []; bgElements = [];
      player.laneIndex = 0;
      player.x = 120;
      player.y = LANES[0];
      player.targetY = LANES[0];
      player.vy = 0;
      player.jumps = 0;
      player.onGround = true;
      player.dead = false;
      player.laneChanging = false;
      overlay.style.display = 'none';
      initBgElements();
    }

    function killPlayer() {
      player.dead = true;
      state = 'dead';
      if (score > best) best = score;
      bestEl.textContent = best;
      spawnDeathParticles();
      setTimeout(() => {
        overlay.style.display = 'flex';
        overlay.innerHTML = `
          <h1 style="color:#ff4444;text-shadow:0 0 20px #ff4444">GAME OVER</h1>
          <div class="subtitle" style="color:#ff8888">☣ KONTAMINIERT ☣</div>
          <div class="controls" style="color:#886666">Punkte: ${score}<br>Bestpunkte: ${best}</div>
          <div class="start-btn" style="color:#ff4444">[ LEERTASTE zum Neustart ]</div>
        `;
      }, 800);
    }

    // ─── Background elements ──────────────────────────────────────────────────
    function initBgElements() {
      bgElements = [];
      for (let i = 0; i < 12; i++) {
        bgElements.push(makeBgElement(Math.random() * W * 2));
      }
    }

    function makeBgElement(x) {
      const type = Math.floor(Math.random() * 5);
      return { x, type, speed: 0.3 + Math.random() * 0.5, h: 60 + Math.random() * 120 };
    }

    function spawnBgElement() {
      bgElements.push(makeBgElement(W + 50));
    }

    // ─── Obstacles ────────────────────────────────────────────────────────────
    function spawnObstacle() {
      const types = ['barrel', 'pipe_h', 'toxic_cloud', 'valve', 'tank'];
      // Higher levels unlock more obstacle types
      const available = types.slice(0, Math.min(2 + level, types.length));
      const type = available[Math.floor(Math.random() * available.length)];
      const lane = Math.floor(Math.random() * LANES.length);
      let obs = { x: W + 60, lane, type };

      switch(type) {
        case 'barrel':
          obs.w = 38; obs.h = 48; obs.y = LANES[lane]; obs.color = '#cc6600';
          break;
        case 'pipe_h':
          obs.w = 22; obs.h = 80 + Math.floor(Math.random() * 60); obs.y = LANES[0] + 50 - obs.h;
          obs.lane = 0; obs.color = '#336644';
          break;
        case 'toxic_cloud':
          obs.w = 70; obs.h = 40; obs.y = LANES[1] + 5; obs.lane = 1;
          obs.color = '#44ff44'; obs.pulse = 0;
          break;
        case 'valve':
          obs.w = 44; obs.h = 44; obs.y = LANES[lane]; obs.color = '#cc3333'; obs.rot = 0;
          break;
        case 'tank':
          obs.w = 60; obs.h = 56; obs.y = LANES[0]; obs.lane = 0; obs.color = '#445566';
          break;
      }
      obstacles.push(obs);
    }

    // ─── Particles ────────────────────────────────────────────────────────────
    function spawnJumpParticles() {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: player.x + player.w / 2, y: player.y + player.h,
          vx: (Math.random() - 0.5) * 4, vy: Math.random() * 2 + 1,
          life: 1, color: '#00ff88', size: 4 + Math.random() * 4
        });
      }
    }

    function spawnDeathParticles() {
      for (let i = 0; i < 30; i++) {
        const angle = (i / 30) * Math.PI * 2;
        particles.push({
          x: player.x + player.w / 2, y: player.y + player.h / 2,
          vx: Math.cos(angle) * (2 + Math.random() * 5),
          vy: Math.sin(angle) * (2 + Math.random() * 5),
          life: 1, color: i % 2 === 0 ? '#ff4444' : '#ffaa00',
          size: 5 + Math.random() * 8
        });
      }
    }

    function spawnRunParticles() {
      if (frame % 6 === 0 && player.onGround) {
        particles.push({
          x: player.x + 5, y: player.y + player.h - 2,
          vx: -speed * 0.5 - Math.random(),
          vy: -Math.random() * 1.5,
          life: 0.8, color: '#00ff4444', size: 3 + Math.random() * 3
        });
      }
    }

    // ─── AABB collision ───────────────────────────────────────────────────────
    function collides(a, b) {
      const margin = 6;
      return !(
        a.x + margin > b.x + b.w - margin ||
        a.x + a.w - margin < b.x + margin ||
        a.y + margin > b.y + b.h - margin ||
        a.y + a.h - margin < b.y + margin
      );
    }

    // ─── Update ───────────────────────────────────────────────────────────────
    let spawnTimer = 0;

    function update() {
      if (state !== 'running') return;
      frame++;
      score++;
      speed = 4 + Math.floor(score / 600) * 0.8;
      level = 1 + Math.floor(score / 600);
      scoreEl.textContent = score;
      levelEl.textContent = level;

      // Spawn obstacle
      const spawnInterval = Math.max(60, 110 - level * 5);
      spawnTimer++;
      if (spawnTimer >= spawnInterval) {
        spawnObstacle();
        spawnTimer = 0;
      }

      // Background spawn
      if (frame % 80 === 0) spawnBgElement();

      // Player physics
      player.y += player.vy;
      player.vy += GRAVITY;

      const groundY = LANES[player.laneIndex];
      if (!player.laneChanging) {
        if (player.y >= groundY) {
          player.y = groundY;
          player.vy = 0;
          player.jumps = 0;
          player.onGround = true;
        }
      } else {
        // Smooth lane change
        const dy = player.targetY - player.y;
        player.y += dy * 0.2;
        if (Math.abs(dy) < 2) {
          player.y = player.targetY;
          player.laneChanging = false;
          player.onGround = true;
          player.vy = 0;
          player.jumps = 0;
        }
      }

      // Move obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.x -= speed;
        if (o.type === 'toxic_cloud') o.pulse = (o.pulse || 0) + 0.1;
        if (o.type === 'valve') o.rot = (o.rot || 0) + 0.05;
        if (o.x + (o.w || 40) < -10) { obstacles.splice(i, 1); continue; }

        // Collision check
        const pb = { x: player.x, y: player.y, w: player.w, h: player.h };
        if (collides(pb, { x: o.x, y: o.y, w: o.w, h: o.h })) {
          killPlayer();
          return;
        }
      }

      // Move bg
      bgElements.forEach(b => b.x -= b.speed * speed * 0.3);
      bgElements = bgElements.filter(b => b.x > -200);

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= 0.04;
        if (p.life <= 0) particles.splice(i, 1);
      }

      spawnRunParticles();
    }

    // ─── Draw helpers ─────────────────────────────────────────────────────────
    function drawRect(x, y, w, h, color, glow) {
      if (glow) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = glow;
      }
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
      ctx.shadowBlur = 0;
    }

    function drawChimneys(bg) {
      const t = Date.now() * 0.001;
      bg.forEach(b => {
        const x = b.x, type = b.type;
        const groundLevel = H - 80;
        const pipeH = b.h;

        if (type === 0) {
          // Tall chimney
          const grad = ctx.createLinearGradient(x, groundLevel - pipeH, x, groundLevel);
          grad.addColorStop(0, '#1a2a1a');
          grad.addColorStop(1, '#2a3a2a');
          ctx.fillStyle = grad;
          ctx.fillRect(x, groundLevel - pipeH, 28, pipeH);
          // Smoke
          for (let s = 0; s < 3; s++) {
            const sy = groundLevel - pipeH - s * 20 - ((t * 30 + s * 15) % 60);
            const alpha = Math.max(0, 0.25 - sy / (groundLevel - pipeH) * 0.1);
            ctx.beginPath();
            ctx.arc(x + 14, sy, 12 + s * 4, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(80,100,80,${alpha})`;
            ctx.fill();
          }
        } else if (type === 1) {
          // Horizontal pipe
          ctx.fillStyle = '#1e3e2e';
          ctx.fillRect(x, groundLevel - 20, 100, 14);
          // Joint bolts
          for (let j = 0; j < 3; j++) {
            ctx.fillStyle = '#2a5a3a';
            ctx.fillRect(x + j * 30 + 10, groundLevel - 24, 10, 18);
          }
        } else if (type === 2) {
          // Storage tank
          ctx.fillStyle = '#162030';
          ctx.fillRect(x, groundLevel - pipeH * 0.8, 60, pipeH * 0.8);
          ctx.fillStyle = '#1e2e3e';
          ctx.fillRect(x + 5, groundLevel - pipeH * 0.8 - 10, 50, 14);
          // Warning stripes
          ctx.fillStyle = '#ff990033';
          for (let st = 0; st < 3; st++) {
            ctx.fillRect(x, groundLevel - pipeH * 0.8 + st * 20, 60, 8);
          }
        } else if (type === 3) {
          // Ladder structure
          ctx.strokeStyle = '#1e3e2e';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(x, groundLevel); ctx.lineTo(x, groundLevel - pipeH); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x + 16, groundLevel); ctx.lineTo(x + 16, groundLevel - pipeH); ctx.stroke();
          for (let r = 0; r < Math.floor(pipeH / 16); r++) {
            ctx.beginPath();
            ctx.moveTo(x, groundLevel - r * 16);
            ctx.lineTo(x + 16, groundLevel - r * 16);
            ctx.stroke();
          }
        } else {
          // Pipes cluster
          [0, 12, 24].forEach((ox, i) => {
            ctx.fillStyle = PIPE_COLS[i];
            ctx.fillRect(x + ox, groundLevel - pipeH * (0.5 + i * 0.15), 10, pipeH * (0.5 + i * 0.15));
          });
        }
      });
    }

    // ─── Draw obstacles ───────────────────────────────────────────────────────
    function drawObstacle(o) {
      ctx.save();
      switch(o.type) {
        case 'barrel': {
          // Body
          const bgrad = ctx.createLinearGradient(o.x, o.y, o.x + o.w, o.y);
          bgrad.addColorStop(0, '#884400');
          bgrad.addColorStop(0.5, '#cc6600');
          bgrad.addColorStop(1, '#663300');
          ctx.fillStyle = bgrad;
          ctx.beginPath();
          ctx.roundRect(o.x, o.y, o.w, o.h, 6);
          ctx.fill();
          // Stripes
          ctx.fillStyle = '#ffcc0033';
          ctx.fillRect(o.x, o.y + o.h * 0.25, o.w, 8);
          ctx.fillRect(o.x, o.y + o.h * 0.6, o.w, 8);
          // Skull
          ctx.fillStyle = '#ffffff88';
          ctx.font = '18px sans-serif';
          ctx.fillText('☠', o.x + 9, o.y + o.h * 0.55);
          // Glow
          ctx.shadowBlur = 12;
          ctx.shadowColor = '#ff6600';
          ctx.strokeStyle = '#ff6600';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(o.x, o.y, o.w, o.h, 6);
          ctx.stroke();
          break;
        }
        case 'pipe_h': {
          const pgrad = ctx.createLinearGradient(o.x, o.y, o.x + o.w, o.y);
          pgrad.addColorStop(0, '#1a4422');
          pgrad.addColorStop(0.5, '#33aa55');
          pgrad.addColorStop(1, '#1a4422');
          ctx.fillStyle = pgrad;
          ctx.fillRect(o.x, o.y, o.w, o.h);
          ctx.shadowBlur = 8;
          ctx.shadowColor = '#33aa55';
          ctx.strokeStyle = '#33aa55';
          ctx.lineWidth = 2;
          ctx.strokeRect(o.x, o.y, o.w, o.h);
          // Bolts
          ctx.fillStyle = '#558866';
          [o.y + 8, o.y + o.h - 14].forEach(by => {
            ctx.beginPath(); ctx.arc(o.x + o.w / 2, by, 5, 0, Math.PI * 2); ctx.fill();
          });
          break;
        }
        case 'toxic_cloud': {
          const pulse = Math.sin(o.pulse) * 0.2 + 0.8;
          ctx.globalAlpha = 0.75 * pulse;
          ctx.shadowBlur = 20;
          ctx.shadowColor = '#44ff44';
          ctx.fillStyle = '#22cc22';
          for (let c = 0; c < 5; c++) {
            ctx.beginPath();
            ctx.arc(o.x + c * 14 + 5, o.y + o.h / 2 + Math.sin(o.pulse + c) * 5, 18 + c * 2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          ctx.font = '13px sans-serif';
          ctx.fillStyle = '#aaffaa';
          ctx.fillText('☣', o.x + o.w / 2 - 8, o.y + o.h / 2 + 5);
          break;
        }
        case 'valve': {
          ctx.translate(o.x + o.w / 2, o.y + o.h / 2);
          ctx.rotate(o.rot);
          ctx.shadowBlur = 14;
          ctx.shadowColor = '#ff3333';
          ctx.fillStyle = '#cc2222';
          // Wheel spokes
          for (let sp = 0; sp < 6; sp++) {
            ctx.save();
            ctx.rotate((sp / 6) * Math.PI * 2);
            ctx.fillRect(-3, -o.h / 2, 6, o.h);
            ctx.restore();
          }
          // Center hub
          ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#ff6666'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(0, 0, o.w / 2 - 4, 0, Math.PI * 2); ctx.stroke();
          break;
        }
        case 'tank': {
          const tgrad = ctx.createLinearGradient(o.x, o.y, o.x + o.w, o.y);
          tgrad.addColorStop(0, '#2a3a4a');
          tgrad.addColorStop(0.5, '#445566');
          tgrad.addColorStop(1, '#2a3a4a');
          ctx.fillStyle = tgrad;
          ctx.beginPath();
          ctx.roundRect(o.x, o.y, o.w, o.h, 10);
          ctx.fill();
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#ffcc00';
          ctx.strokeStyle = '#ffcc00';
          ctx.lineWidth = 2;
          ctx.strokeRect(o.x + 4, o.y + 4, o.w - 8, o.h - 8);
          ctx.fillStyle = '#ffcc00aa';
          ctx.font = '22px sans-serif';
          ctx.fillText('⚗', o.x + o.w / 2 - 12, o.y + o.h / 2 + 8);
          break;
        }
      }
      ctx.restore();
    }

    // ─── Draw player ──────────────────────────────────────────────────────────
    function drawPlayer() {
      const px = player.x, py = player.y, pw = player.w, ph = player.h;
      const t = Date.now() * 0.005;
      const bob = player.onGround ? Math.sin(t * 4) * 2 : 0;

      ctx.save();

      // Glow aura
      ctx.shadowBlur = 20;
      ctx.shadowColor = player.dead ? '#ff4444' : '#00ff88';

      // Body (hazmat suit)
      const bodyGrad = ctx.createLinearGradient(px, py, px + pw, py + ph);
      bodyGrad.addColorStop(0, player.dead ? '#442222' : '#1a4a2a');
      bodyGrad.addColorStop(0.5, player.dead ? '#883333' : '#2a8a4a');
      bodyGrad.addColorStop(1, player.dead ? '#442222' : '#1a4a2a');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.roundRect(px, py + bob, pw, ph, 4);
      ctx.fill();

      // Visor
      ctx.fillStyle = player.dead ? '#ff444488' : '#00ffcc88';
      ctx.beginPath();
      ctx.roundRect(px + 6, py + 6 + bob, pw - 12, 16, 3);
      ctx.fill();

      // Visor shine
      ctx.fillStyle = '#ffffff33';
      ctx.fillRect(px + 8, py + 8 + bob, pw - 20, 4);

      // Hazmat symbol
      ctx.fillStyle = player.dead ? '#ff444488' : '#00ff8866';
      ctx.font = '14px sans-serif';
      ctx.fillText('☣', px + 8, py + ph * 0.7 + bob);

      // Legs animation
      if (player.onGround && !player.dead) {
        const legSwing = Math.sin(t * 8) * 6;
        ctx.fillStyle = '#1a5a2a';
        ctx.fillRect(px + 4, py + ph - 12 + bob, 10, 12 + legSwing);
        ctx.fillRect(px + pw - 14, py + ph - 12 + bob, 10, 12 - legSwing);
      }

      // Outline
      ctx.shadowBlur = 0;
      ctx.strokeStyle = player.dead ? '#ff4444' : '#00ff88';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(px, py + bob, pw, ph, 4);
      ctx.stroke();

      ctx.restore();
    }

    // ─── Draw floor / platform lanes ─────────────────────────────────────────
    function drawLanes() {
      // Ground floor
      const floorY = H - 80;
      const fgrad = ctx.createLinearGradient(0, floorY, 0, H);
      fgrad.addColorStop(0, '#0d2230');
      fgrad.addColorStop(1, '#060e18');
      ctx.fillStyle = fgrad;
      ctx.fillRect(0, floorY, W, H - floorY);

      // Floor grid lines
      ctx.strokeStyle = '#1a3a4a44';
      ctx.lineWidth = 1;
      for (let gx = (bgX % 60); gx < W; gx += 60) {
        ctx.beginPath(); ctx.moveTo(gx, floorY); ctx.lineTo(gx, H); ctx.stroke();
      }
      ctx.strokeStyle = '#1a3a4a66';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(W, floorY); ctx.stroke();

      // Platform lanes (mid, top)
      [1, 2].forEach(i => {
        const py = LANES[i] + player.h + 4;
        const platGrad = ctx.createLinearGradient(0, py, 0, py + 10);
        platGrad.addColorStop(0, '#0d3a2a');
        platGrad.addColorStop(1, '#071a14');
        ctx.fillStyle = platGrad;
        ctx.fillRect(0, py, W, 10);
        // Glow edge
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#00ff4422';
        ctx.strokeStyle = '#00ff4444';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(W, py); ctx.stroke();
        ctx.shadowBlur = 0;
      });
    }

    // ─── Draw sky / ambient ───────────────────────────────────────────────────
    function drawSky() {
      const skyGrad = ctx.createLinearGradient(0, 0, 0, H - 80);
      skyGrad.addColorStop(0, '#050510');
      skyGrad.addColorStop(0.6, '#0a1a14');
      skyGrad.addColorStop(1, '#0d2020');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, H - 80);

      // Hazard glow on horizon
      const glow = ctx.createRadialGradient(W / 2, H - 80, 0, W / 2, H - 80, 300);
      glow.addColorStop(0, '#00ff4422');
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);
    }

    // ─── Draw HUD warning ─────────────────────────────────────────────────────
    function drawHUD() {
      const t = Date.now() * 0.003;
      // Scanlines
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      for (let sl = 0; sl < H; sl += 4) {
        ctx.fillRect(0, sl, W, 2);
      }
      // Corner warning brackets
      const bSize = 20, bOff = 8;
      ctx.strokeStyle = '#00ff8844';
      ctx.lineWidth = 2;
      [[bOff, bOff],[W - bOff, bOff],[bOff, H - bOff],[W - bOff, H - bOff]].forEach(([cx, cy], i) => {
        const xs = i % 2 === 0 ? 1 : -1, ys = i < 2 ? 1 : -1;
        ctx.beginPath(); ctx.moveTo(cx, cy + ys * bSize); ctx.lineTo(cx, cy); ctx.lineTo(cx + xs * bSize, cy); ctx.stroke();
      });
    }

    // ─── Main draw ────────────────────────────────────────────────────────────
    function draw() {
      ctx.clearRect(0, 0, W, H);
      bgX -= speed * 0.5;

      drawSky();
      drawChimneys(bgElements);
      drawLanes();

      // Particles
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
      });

      obstacles.forEach(drawObstacle);
      drawPlayer();
      drawHUD();
    }

    // ─── Init bg and loop ─────────────────────────────────────────────────────
    initBgElements();
    overlay.style.display = 'flex';

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
